# Copy to config.toml and supply your own high-entropy root key (at least 32 bytes).
# This placeholder is deliberately rejected at startup. Never commit real credentials.
root_key = "REPLACE_WITH_A_RANDOM_ROOT_KEY_AT_LEAST_32_BYTES"
bind = "127.0.0.1:8080"
state_path = "data/account.json"
# Optional: defaults to checkin.json alongside state_path (same private volume).
# Independent 0600 JSON, at most 180 summaries per account; schedule defaults off.
# checkin_state_path = "data/checkin.json"
# Reserved independent state path; must differ from config/account/check-in paths.
# request_log_path = "data/request_logs.json"
# Separate typed system events and operator log preferences (0700 parent/0600 files).
# Defaults alongside state_path; every path must differ from config and all state.
# system_log_path = "data/system_logs.json"
# log_settings_path = "data/log_settings.json"
# /api/log-settings controls hot severity and both 1..90 day retention periods.
# Default INFO/7/7. DEBUG/TRACE enables safe diagnostics for NEW login tasks only;
# login_diagnostics below separately controls diagnostic metadata in API errors.
frontend_dir = "frontend/dist"
browser_helper_dir = "tools/browser-helper"
# Opt-in container listener. Remote web origins normally require HTTPS and secure cookies.
# Container mode uses a dedicated subreaper for browser lifecycle, NOT a sandbox.
# Requires a private container PID namespace; --pid=host / hostPID is forbidden.
# Lost cleanup ACK, worker crash, or cleanup timeout fatally exits the service:
# the container PID namespace must then be torn down to remove all descendants.
# Non-container mode retains user/PID namespaces, with no automatic fallback.
container_mode = false
cookie_secure = false
# Explicit plaintext LAN exception: container_mode=true, cookie_secure=false,
# and exact HTTP origins with literal IPv4 ONLY in 192.168.0.0/16, for example
# allowed_origin = ["http://192.168.1.127:30880"]. No hostnames or other private ranges.
# WARNING: root key, passwords, session cookies and API traffic travel in plaintext.
# This is NOT a network firewall. Require a trusted-LAN firewall; never expose publicly.
allow_insecure_lan_http = false
# Docker can set an absolute, operator-controlled Python executable (no uv at runtime):
# browser_helper_executable = "/app/tools/browser-helper/.venv/bin/python"
helper_timeout = 90
# Enable only temporarily: fixed, non-secret login metadata; no raw browser content.
login_diagnostics = false
allowed_origin = ["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:8080", "http://127.0.0.1:8080"]
