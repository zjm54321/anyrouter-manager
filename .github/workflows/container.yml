name: Private container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Never build/export the proprietary binary in a public repository workflow.
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Static container contract and mock gates
        run: python3 -B tests/container/test_contract.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
      - name: Read-only PR build (no registry credentials or publication)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: anyrouter-manager:ci
          provenance: false
          sbom: false
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: PR web smoke and mandatory production supervisor/browser gate
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          status=0
          python3 -B tests/container/ci_smoke.py anyrouter-manager:ci || status=$?
          case "$status" in
            0) ;;
            2) printf '%s\n' '::warning::Build-only evidence: required production supervisor capability probe is blocked. Image stays runner-local; no artifact or registry publication. This is not a runtime pass.' ;;
            *) exit "$status" ;;
          esac

  publish:
    needs: validate
    if: >-
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load once (this exact image is tested and pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: anyrouter-manager:ci
          provenance: false
          sbom: false
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Test exact loaded image and fail closed on unsupported runtime
        id: smoke
        shell: bash
        run: |
          status=0
          python3 -B tests/container/ci_smoke.py anyrouter-manager:ci || status=$?
          case "$status" in
            0) ;;
            2) printf '%s\n' '::warning::Build-only evidence: required production supervisor capability probe is blocked. No login or publication; image remains runner-local. This is not a runtime pass.' ;;
            *) exit "$status" ;;
          esac
      - name: Lowercase private image name
        if: steps.smoke.outputs.publish_ready == 'true'
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'name=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing non-private GHCR package
        if: steps.smoke.outputs.publish_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: python3 -B docker/ghcr_visibility.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.smoke.outputs.publish_ready == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push the tested immutable image ID (never rebuild)
        if: steps.smoke.outputs.publish_ready == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
          TESTED_IMAGE_ID: ${{ steps.smoke.outputs.tested_image_id }}
        run: |
          test "$(docker image inspect --format '{{.Id}}' anyrouter-manager:ci)" = "$TESTED_IMAGE_ID"
          docker tag "$TESTED_IMAGE_ID" "$IMAGE:sha-$REVISION"
          docker tag "$TESTED_IMAGE_ID" "$IMAGE:main"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:main"
      - name: Verify published package is private
        if: steps.smoke.outputs.publish_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: python3 -B docker/ghcr_visibility.py --require-existing
